# Builds a container image from source and pushes it to this repository's GitHub
# Container Registry, so hosts with little RAM (EasyPanel, Coolify, small VPSes)
# can pull a ready image instead of compiling the frontend themselves.
#
# The image is tagged with the branch name and the short commit SHA, e.g.
#   ghcr.io/<owner>/libredesk:feature-inbox-table-view
#   ghcr.io/<owner>/libredesk:sha-15c07a2e
#
# NOTE: a newly created GHCR package is private even when the repository is
# public. After the first run, open the package page and either make it public
# or give your host a pull secret. See DEVELOPMENT.md.
name: Build image

on:
  push:
    branches:
      - main
      - "feature/**"
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # The registry path must be lowercase; GitHub owner names need not be.
      - name: Resolve image name and version
        id: vars
        run: |
          echo "image=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"
          echo "version=${GITHUB_REF_NAME}-${GITHUB_SHA::8}" >> "$GITHUB_OUTPUT"

      - name: Derive tags
        uses: docker/metadata-action@v5
        id: meta
        with:
          images: ${{ steps.vars.outputs.image }}
          tags: |
            type=ref,event=branch
            type=sha,prefix=sha-
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile.build
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            LIBREDESK_VERSION=${{ steps.vars.outputs.version }}
            NODE_HEAP_MB=4096
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Summary
        run: |
          {
            echo "### Image pushed"
            echo
            echo '```'
            echo '${{ steps.meta.outputs.tags }}'
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
